name: Publish declarative package

on:
  push:
    branches: [main]
    paths:
      - "packages/*.json"

permissions:
  contents: write

concurrency:
  group: staging-package-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate, release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          package="$(find packages -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)"
          test -n "$package"
          eval "$(python - "$package" <<'PY'
          import hashlib, json, pathlib, shlex, sys
          path = pathlib.Path(sys.argv[1])
          raw = path.read_bytes()
          data = json.loads(raw)
          required = {"schemaVersion", "packageId", "packageVersion", "contentVersionFrom", "contentVersionTo", "minimumAppVersion", "operations", "integrity"}
          if required - data.keys():
              raise SystemExit("pacote incompleto")
          if not data["operations"]:
              raise SystemExit("pacote sem operacoes")
          if any(op.get("entity") != "summaryMetadata" or op.get("payload", {}).get("metadataNormativa", {}).get("environment") != "staging" or op.get("payload", {}).get("metadataNormativa", {}).get("affectsProductionContent") is not False for op in data["operations"]):
              raise SystemExit("pacote de homologacao nao inofensivo")
          values = {
              "PACKAGE_ID": data["packageId"], "VERSION": data["packageVersion"],
              "FROM_VERSION": data["contentVersionFrom"], "TO_VERSION": data["contentVersionTo"],
              "MIN_APP": data["minimumAppVersion"], "SHA": hashlib.sha256(raw).hexdigest(),
              "SIZE": str(len(raw)), "PACKAGE_NAME": path.name,
          }
          for key, value in values.items():
              print(f"{key}={shlex.quote(str(value))}")
          PY
          )"
          tag="content-v${VERSION}-staging"
          release_created=false
          rollback() {
            if [[ "$release_created" == true ]]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          }
          trap rollback ERR
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release preexistente; validando idempotencia."
          else
            gh release create "$tag" "$package" --repo "$GITHUB_REPOSITORY" --title "Homologacao ${VERSION}" --notes "Pacote declarativo inofensivo de homologacao." --target "$GITHUB_SHA"
            release_created=true
          fi
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${PACKAGE_NAME}"
          curl --fail --location --silent --show-error "$asset_url" --output /tmp/remote-package.json
          test "$(wc -c < /tmp/remote-package.json | tr -d ' ')" = "$SIZE"
          test "$(sha256sum /tmp/remote-package.json | cut -d' ' -f1)" = "$SHA"
          python - "$asset_url" "$SHA" "$SIZE" "$PACKAGE_ID" "$VERSION" "$TO_VERSION" "$MIN_APP" <<'PY'
          import datetime, json, pathlib, sys
          url, sha, size, package_id, version, content_version, minimum = sys.argv[1:]
          path = pathlib.Path("manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if any(p["id"] == package_id for p in manifest["packages"]):
              existing = next(p for p in manifest["packages"] if p["id"] == package_id)
              if existing["sha256"] != sha or existing["url"] != url:
                  raise SystemExit("package ID duplicado divergente")
              raise SystemExit(0)
          manifest["contentVersion"] = content_version
          manifest["minimumAppVersion"] = minimum
          manifest["publishedAt"] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          manifest["packages"].append({
              "id": package_id, "type": "legal-content", "version": version,
              "url": url, "sha256": sha, "sizeBytes": int(size),
              "compression": "none", "required": False,
              "description": "Pacote declarativo inofensivo de homologacao."
          })
          manifest["message"]["pt-BR"] = "Homologacao automatizada do sistema de atualizacoes."
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          if git diff --quiet -- manifest.json; then
            echo "Manifesto ja publicado; idempotencia confirmada."
            release_created=false
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: publica pacote de homologacao ${VERSION}"
          git push origin HEAD:main
          release_created=false
